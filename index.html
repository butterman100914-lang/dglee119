            </nav>
            <div class="topbar-actions">
              <button type="button" class="btn btn-outline btn-sm" data-action="download-html">
                ${svgIcon('download', 14)}<span>index.html 다운로드</span>
              </button>
              ${user.role === 'leader' ? `
                <button type="button" class="btn btn-dark btn-sm" data-action="open-members">
                  ${svgIcon('users', 14)}<span>멤버·권한</span>
                </button>
              ` : `
                <button type="button" class="btn btn-outline btn-sm" data-action="logout">
                  ${svgIcon('logout', 14)}<span>로그아웃</span>
                </button>
              `}
            </div>
          </header>

          <nav class="mobile-nav">
            ${navItems.filter(n => n.visible).map(n => `
              <button type="button" class="btn btn-sm ${state.activeTab === n.id ? 'btn-primary' : 'btn-outline'}" data-action="switch-tab" data-tab="${n.id}">${n.label}</button>
            `).join('')}
          </nav>

          <div class="container">
            <div class="workspace-head">
              <div>
                <h1 class="workspace-title">${esc(activeNav.label)}</h1>
                <div class="workspace-meta">
                  접속자: <strong style="color:var(--text-primary)">${esc(user.name)}</strong> · ${esc(user.title)}
                  ${user.isResearcher ? ' · CO₂ 연구 담당' : ''}
                </div>
              </div>
              ${user.role === 'leader' ? `
                <button type="button" class="btn btn-outline btn-sm" data-action="logout">
                  ${svgIcon('logout', 14)}<span>계정 전환 / 로그아웃</span>
                </button>
              ` : ''}
            </div>

            ${state.feedback ? `<div class="alert ${state.feedback.type === 'ok' ? 'alert-ok' : 'alert-err'}">${esc(state.feedback.text)}</div>` : ''}

            ${bodyHtml}
          </div>
          ${renderMemberModal(user)}
        </div>
      `;

      bindDynamicInputs();
      if (state.cameraActive && state.mediaStream) {
        const vid = document.getElementById('att-video');
        if (vid && vid.srcObject !== state.mediaStream) {
          vid.srcObject = state.mediaStream;
          vid.play().catch(() => {});
        }
      }
      const wScroll = document.getElementById('whisper-scroll');
      if (wScroll) wScroll.scrollTop = wScroll.scrollHeight;
    }

    function bindDynamicInputs() {
      const presetSel = document.getElementById('behavior-preset-select');
      if (presetSel) {
        presetSel.onchange = () => {
          const [, , label, pts] = presetSel.value.split('|');
          const lblInput = document.getElementById('behavior-label-input');
          const ptsInput = document.getElementById('behavior-points-input');
          if (lblInput) lblInput.value = label;
          if (ptsInput) ptsInput.value = pts;
        };
      }
      const searchInp = document.getElementById('overview-search-input');
      if (searchInp) {
        searchInp.oninput = (e) => {
          state.overviewSearch = e.target.value;
          const pos = e.target.selectionStart;
          render();
          const next = document.getElementById('overview-search-input');
          if (next) { next.focus(); next.setSelectionRange(pos, pos); }
        };
      }
      const rx = document.getElementById('research-x-select');
      if (rx) rx.onchange = (e) => { state.xAxisKey = e.target.value; render(); };
      const ry = document.getElementById('research-y-select');
      if (ry) ry.onchange = (e) => { state.yAxisKey = e.target.value; render(); };
    }

    // ==================== CAMERA & GEOLOCATION ====================
    function stopCamera() {
      if (state.mediaStream) {
        state.mediaStream.getTracks().forEach(t => t.stop());
        state.mediaStream = null;
      }
      state.cameraActive = false;
    }

    function refreshGeo() {
      if (!navigator.geolocation) {
        state.geo = { status: 'err', lat: null, lng: null, acc: null, label: '위치 서비스 미지원', err: '브라우저가 위치 정보를 지원하지 않습니다.' };
        render();
        return;
      }
      state.geo.status = 'loading';
      state.geo.err = null;
      render();
      navigator.geolocation.getCurrentPosition(
        async (pos) => {
          const lat = Number(pos.coords.latitude.toFixed(6));
          const lng = Number(pos.coords.longitude.toFixed(6));
          const acc = Math.round(pos.coords.accuracy);
          let label = `위도 ${lat}, 경도 ${lng}`;
          try {
            const ctrl = new AbortController();
            setTimeout(() => ctrl.abort(), 2500);
            const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}&accept-language=ko`, { signal: ctrl.signal });
            if (r.ok) {
              const d = await r.json();
              if (d.address) {
                const parts = [d.address.city, d.address.borough || d.address.suburb, d.address.neighbourhood || d.address.road].filter(Boolean).join(' ');
                if (parts) label = parts;
              }
            }
          } catch (e) {}
          state.geo = { status: 'ready', lat, lng, acc, label, err: null };
          render();
        },
        (err) => {
          state.geo = { status: 'err', lat: null, lng: null, acc: null, label: '위치 권한 필요', err: '위치 수신 실패: ' + err.message };
          render();
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    async function startCamera() {
      state.cameraError = null;
      refreshGeo();
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        state.cameraError = '이 브라우저에서는 실시간 카메라를 사용할 수 없습니다.';
        render();
        return;
      }
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
        state.mediaStream = stream;
        state.cameraActive = true;
        render();
      } catch (err) {
        state.cameraError = '카메라를 시작할 수 없습니다 (' + err.message + '). 조작 방지를 위해 파일 업로드는 허용되지 않습니다.';
        render();
      }
    }

    async function captureAttendance(user) {
      const vid = document.getElementById('att-video');
      if (!vid) return;
      const w = vid.videoWidth || 1280, h = vid.videoHeight || 720;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(vid, 0, 0, w, h);

      const nowIso = new Date().toISOString();
      const stamp = formatKstDateTime(nowIso);
      const locStamp = state.geo.lat !== null
        ? `${state.geo.label} (${state.geo.lat}, ${state.geo.lng} · ±${state.geo.acc}m)`
        : state.geo.label;

      const barH = Math.max(72, Math.round(h * 0.14));
      ctx.fillStyle = 'rgba(15, 23, 42, 0.84)';
      ctx.fillRect(0, h - barH, w, barH);
      ctx.fillStyle = '#f8fafc';
      ctx.font = `bold ${Math.max(16, Math.round(w * 0.022))}px monospace`;
      ctx.fillText(`CAPTURE TIME (KST): ${stamp}`, 24, h - barH + Math.round(barH * 0.42));
      ctx.fillStyle = '#93c5fd';
      ctx.font = `${Math.max(14, Math.round(w * 0.018))}px sans-serif`;
      ctx.fillText(`LOCATION: ${locStamp}`, 24, h - barH + Math.round(barH * 0.78));

      const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
      if (!blob) return;

      const sel = document.getElementById('attendance-student-select');
      const targetStuId = (user.role === 'leader' && sel) ? sel.value : (user.studentId || user.id);
      const stu = state.store.students.find(s => s.id === targetStuId);

      const mediaId = randomId('attmedia');
      await saveMediaBlob(mediaId, blob);

      const verifyHash = (await sha256Hex(`${targetStuId}|${nowIso}|${state.geo.lat}|${state.geo.lng}|${blob.size}`)).slice(0, 12).toUpperCase();
      state.store.attendanceCheckins.unshift({
        id: randomId('att'),
        mediaId,
        studentId: targetStuId,
        studentName: stu ? stu.name : user.name,
        room: stu ? stu.room : user.room,
        latitude: state.geo.lat,
        longitude: state.geo.lng,
        accuracy: state.geo.acc,
        locationLabel: state.geo.label,
        capturedAt: nowIso,
        verificationCode: verifyHash
      });
      saveStore();
      stopCamera();
      setFeedback('ok', '실시간 학원 출석 사진과 시각·위치 인증 기록이 저장되었습니다.');
      render();
    }

    // ==================== EVENT DELEGATION ====================
    document.addEventListener('click', async (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.getAttribute('data-action');
      const user = getCurrentUser();

      if (action === 'download-html') {
        downloadStandaloneIndexHtml();
        return;
      }
      if (action === 'auth-tab') {
        state.authTab = target.getAttribute('data-tab');
        state.authError = null;
        render();
        return;
      }
      if (action === 'logout') {
        stopCamera();
        setCurrentUser(null);
        state.feedback = null;
        render();
        return;
      }
      if (!user) return;

      if (action === 'switch-tab') {
        const tab = target.getAttribute('data-tab');
        if (tab === 'research' && !user.isResearcher) return;
        if (state.activeTab === 'attendance' && tab !== 'attendance') stopCamera();
        state.activeTab = tab;
        state.feedback = null;
        render();
      } else if (action === 'overview-filter') {
        state.overviewFilter = target.getAttribute('data-filter');
        render();
      } else if (action === 'select-student') {
        state.selectedStudentId = target.getAttribute('data-student-id');
        state.hoveredScoreLogId = null;
        render();
      } else if (action === 'quick-drowsy' && user.role === 'leader') {
        e.stopPropagation();
        const sid = target.getAttribute('data-student-id');
        const stu = state.store.students.find(s => s.id === sid);
        if (!stu) return;
        state.store.behaviorLogs.unshift({
          id: randomId('log'),
          studentId: stu.id,
          studentName: stu.name,
          category: 'drowsiness',
          label: '면학 중 졸음',
          type: 'drowsy',
          pointsDelta: -1,
          note: '면학 중 졸음 빠른 체크',
          recordedByName: `${user.name} (${user.title})`,
          recordedAt: new Date().toISOString()
        });
        state.selectedStudentId = stu.id;
        saveStore();
        setFeedback('ok', `${stu.name} 학생 졸음 1회가 기록되었습니다.`);
        render();
      } else if (action === 'delete-behavior' && user.role === 'leader') {
        const lid = target.getAttribute('data-log-id');
        state.store.behaviorLogs = state.store.behaviorLogs.filter(l => l.id !== lid);
        saveStore();
        render();
      } else if (action === 'extra-filter') {
        state.extraFilter = target.getAttribute('data-filter');
        render();
      } else if (action === 'set-extra-choice') {
        const sid = target.getAttribute('data-student-id');
        const choice = target.getAttribute('data-choice');
        const isLeader = user.role === 'leader';
        if (!isLeader && user.studentId !== sid) return;
        if (!isLeader && isPastDeadline(state.store.config)) {
          setFeedback('err', `마감 시간(${state.store.config.extraStudyDeadline})이 지나 수정할 수 없습니다.`);
          render();
          return;
        }
        const dCnt = getDrowsyCount(sid);
        if (dCnt >= state.store.config.maxDrowsyLimit && choice !== 'none') {
          setFeedback('err', `졸음 횟수(${dCnt}회)가 제한 기준(${state.store.config.maxDrowsyLimit}회) 이상이므로 추가면학을 신청할 수 없습니다.`);
          render();
          return;
        }
        const stu = state.store.students.find(s => s.id === sid);
        let row = state.store.extraStudyApplications.find(a => a.studentId === sid);
        const now = new Date().toISOString();
        if (!row && stu) {
          row = { studentId: stu.id, studentName: stu.name, room: stu.room, choice, previousChoice: null, isChanged: false, changedAt: null, acknowledgedBy: null, acknowledgedAt: null, updatedAt: now };
          state.store.extraStudyApplications.push(row);
        } else if (row && row.choice !== choice) {
          row.previousChoice = row.choice;
          row.choice = choice;
          row.isChanged = true;
          row.changedAt = now;
          row.acknowledgedBy = null;
          row.acknowledgedAt = null;
          row.updatedAt = now;
        }
        saveStore();
        setFeedback('ok', '추가 면학 신청이 반영되었습니다. 변경 시 방장 확인 전까지 강조 표시됩니다.');
        render();
      } else if (action === 'ack-extra' && user.role === 'leader') {
        const sid = target.getAttribute('data-student-id');
        const row = state.store.extraStudyApplications.find(a => a.studentId === sid);
        if (row) {
          row.isChanged = false;
          row.acknowledgedBy = `${user.name} (${user.title})`;
          row.acknowledgedAt = new Date().toISOString();
          saveStore();
          setFeedback('ok', '변경 확인이 완료되어 강조 표시가 해제되었습니다.');
          render();
        }
      } else if (action === 'delete-notice' && user.role === 'leader') {
        const nid = target.getAttribute('data-notice-id');
        state.store.notices = state.store.notices.filter(n => n.id !== nid);
        saveStore();
        render();
      } else if (action === 'open-lightbox') {
        state.lightboxUrl = target.getAttribute('data-url');
        render();
      } else if (action === 'close-lightbox') {
        state.lightboxUrl = null;
        render();
      } else if (action === 'refresh-geo') {
        refreshGeo();
      } else if (action === 'start-camera') {
        startCamera();
      } else if (action === 'stop-camera') {
        stopCamera();
        render();
      } else if (action === 'capture-attendance') {
        captureAttendance(user);
      } else if (action === 'select-whisper') {
        state.whisperPartnerId = target.getAttribute('data-partner-id');
        render();
      } else if (action === 'set-graph') {
        state.graphType = target.getAttribute('data-graph');
        render();
      } else if (action === 'delete-metric' && user.isResearcher) {
        const mid = target.getAttribute('data-metric-id');
        state.store.customMetrics = state.store.customMetrics.filter(m => m.id !== mid);
        if (state.xAxisKey === mid) state.xAxisKey = 'co2Ppm';
        saveStore();
        render();
      } else if (action === 'delete-research' && user.isResearcher) {
        const rid = target.getAttribute('data-log-id');
        state.store.researchLogs = state.store.researchLogs.filter(l => l.id !== rid);
        saveStore();
        render();
      } else if (action === 'export-research-csv' && user.isResearcher) {
        const metrics = state.store.customMetrics;
        const headers = ['측정시각', '회차명', 'CO2(ppm)', '총인원', '졸음인원', '졸음비율(%)', '출입문환기', ...metrics.map(m => m.unit ? `${m.name}(${m.unit})` : m.name), '비고'];
        const rows = state.store.researchLogs.map(l => [
          formatKstDateTime(l.recordedAt), l.sessionLabel, l.co2Ppm, l.totalStudents, l.drowsyStudents, l.drowsyRate,
          l.doorVentilation === 'open' ? '개방' : l.doorVentilation === 'partial' ? '부분개방' : '닫힘',
          ...metrics.map(m => l.customValues[m.id] === undefined ? '' : typeof l.customValues[m.id] === 'boolean' ? (l.customValues[m.id] ? '예' : '아니오') : l.customValues[m.id]),
          l.note || ''
        ]);
        const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `co2-research-${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
        URL.revokeObjectURL(url);
      } else if (action === 'open-members' && user.role === 'leader') {
        state.showMemberModal = true;
        render();
      } else if (action === 'close-members') {
        state.showMemberModal = false;
        render();
      } else if (action === 'toggle-role' && user.role === 'leader') {
        const uid = target.getAttribute('data-user-id');
        const t = state.store.users.find(u => u.id === uid);
        if (t && t.id !== user.id) {
          t.role = t.role === 'leader' ? 'student' : 'leader';
          saveStore();
          render();
        }
      } else if (action === 'toggle-researcher' && user.role === 'leader') {
        const uid = target.getAttribute('data-user-id');
        const t = state.store.users.find(u => u.id === uid);
        if (t) {
          t.isResearcher = !t.isResearcher;
          saveStore();
          render();
        }
      }
    });

    // Hover events for SVG charts
    document.addEventListener('mouseover', (e) => {
      const s = e.target.closest('[data-hover-score]');
      if (s) {
        const id = s.getAttribute('data-hover-score');
        if (state.hoveredScoreLogId !== id) { state.hoveredScoreLogId = id; render(); }
        return;
      }
      const r = e.target.closest('[data-hover-research]');
      if (r) {
        const id = r.getAttribute('data-hover-research');
        if (state.hoveredResearchId !== id) { state.hoveredResearchId = id; render(); }
      }
    });

    // Form Submissions
    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const fd = new FormData(form);
      const user = getCurrentUser();

      if (form.id === 'auth-form') {
        state.authError = null;
        const needsBootstrap = state.store.users.length === 0;
        const username = String(fd.get('username') || '').trim();
        const password = String(fd.get('password') || '');

        if (needsBootstrap) {
          const name = String(fd.get('name') || '').trim();
          const title = String(fd.get('title') || '총괄 반장').trim();
          const confirm = String(fd.get('confirmPassword') || '');
          if (password !== confirm) { state.authError = '비밀번호 확인이 일치하지 않습니다.'; render(); return; }
          const newUser = {
            id: randomId('usr'), username, name, title, role: 'leader', isResearcher: true,
            room: '운영실', passwordHash: await hashPassword(password), createdAt: new Date().toISOString()
          };
          state.store.users.push(newUser);
          saveStore();
          setCurrentUser(newUser.id);
          render();
        } else if (state.authTab === 'register') {
          const name = String(fd.get('name') || '').trim();
          const room = String(fd.get('room') || '').trim();
          const grade = String(fd.get('grade') || '2학년').trim();
          const confirm = String(fd.get('confirmPassword') || '');
          if (password !== confirm) { state.authError = '비밀번호 확인이 일치하지 않습니다.'; render(); return; }
          if (state.store.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
            state.authError = '이미 사용 중인 아이디입니다.'; render(); return;
          }
          let stu = state.store.students.find(s => s.name === name);
          if (!stu) {
            stu = { id: randomId('stu'), name, room, grade, createdAt: new Date().toISOString() };
            state.store.students.push(stu);
            state.store.extraStudyApplications.push({
              studentId: stu.id, studentName: stu.name, room: stu.room, choice: 'none',
              previousChoice: null, isChanged: false, changedAt: null, acknowledgedBy: null, acknowledgedAt: null, updatedAt: new Date().toISOString()
            });
          }
          const newUser = {
            id: randomId('usr'), username, name: stu.name, title: `${stu.room} 학생`, role: 'student',
            isResearcher: false, room: stu.room, studentId: stu.id, passwordHash: await hashPassword(password), createdAt: new Date().toISOString()
          };
          state.store.users.push(newUser);
          saveStore();
          setCurrentUser(newUser.id);
          render();
        } else {
          const found = state.store.users.find(u => u.username.toLowerCase() === username.toLowerCase() || u.name.toLowerCase() === username.toLowerCase());
          if (!found || !(await verifyPassword(password, found.passwordHash))) {
            state.authError = '아이디(또는 실명)와 비밀번호를 확인해 주세요.'; render(); return;
          }
          setCurrentUser(found.id);
          state.feedback = null;
          render();
        }
        return;
      }

      if (!user) return;

      if (form.id === 'limit-form' && user.role === 'leader') {
        const val = Math.max(1, Math.min(20, Math.round(Number(fd.get('maxDrowsyLimit') || 3))));
        state.store.config.maxDrowsyLimit = val;
        saveStore();
        setFeedback('ok', `졸음 제한 기준이 ${val}회로 변경되었습니다.`);
        render();
      } else if (form.id === 'behavior-form' && user.role === 'leader') {
        const sid = String(fd.get('studentId'));
        const stu = state.store.students.find(s => s.id === sid);
        if (!stu) return;
        const [type, category] = String(fd.get('preset')).split('|');
        const absPts = Math.max(0, Math.min(20, Math.round(Number(fd.get('pointsAbs') || 1))));
        state.store.behaviorLogs.unshift({
          id: randomId('log'),
          studentId: stu.id,
          studentName: stu.name,
          category,
          label: String(fd.get('label') || '').trim(),
          type,
          pointsDelta: type === 'merit' ? absPts : -absPts,
          note: String(fd.get('note') || '').trim(),
          recordedByName: `${user.name} (${user.title})`,
          recordedAt: new Date().toISOString()
        });
        state.selectedStudentId = stu.id;
        saveStore();
        setFeedback('ok', `${stu.name} 학생 기록이 저장되었습니다.`);
        render();
      } else if (form.id === 'deadline-form' && user.role === 'leader') {
        state.store.config.deadlineEnabled = form.querySelector('[name="deadlineEnabled"]').checked;
        state.store.config.extraStudyDeadline = String(fd.get('extraStudyDeadline') || '24:00').trim();
        saveStore();
        setFeedback('ok', '추가 면학 신청 마감 설정이 저장되었습니다.');
        render();
      } else if (form.id === 'notice-form' && user.role === 'leader') {
        const fileInput = document.getElementById('notice-files');
        const files = fileInput ? Array.from(fileInput.files || []).slice(0, 5) : [];
        const attachments = [];
        for (const f of files) {
          const mid = randomId('nmedia');
          await saveMediaBlob(mid, f);
          attachments.push({
            id: mid,
            originalName: f.name,
            kind: f.type.startsWith('video/') ? 'video' : 'image'
          });
        }
        state.store.notices.unshift({
          id: randomId('notice'),
          title: String(fd.get('title') || '').trim(),
          content: String(fd.get('content') || '').trim(),
          scheduleDate: String(fd.get('scheduleDate') || '').trim() || null,
          authorName: user.name,
          authorTitle: user.title,
          attachments,
          createdAt: new Date().toISOString()
        });
        saveStore();
        setFeedback('ok', `${user.name} (${user.title}) 명의로 공지가 등록되었습니다.`);
        render();
      } else if (form.id === 'whisper-form') {
        const partner = state.store.users.find(u => u.id === state.whisperPartnerId);
        const text = String(fd.get('text') || '').trim();
        if (!partner || !text) return;
        const isLeader = user.role === 'leader';
        const stuUser = isLeader ? partner : user;
        const ldrUser = isLeader ? user : partner;
        state.store.whisperMessages.push({
          id: randomId('msg'),
          threadKey: `${stuUser.id}__${ldrUser.id}`,
          studentUserId: stuUser.id,
          leaderUserId: ldrUser.id,
          senderUserId: user.id,
          senderName: isLeader ? `${user.name} (${user.title})` : user.name,
          text,
          readByRecipient: false,
          readAt: null,
          createdAt: new Date().toISOString()
        });
        saveStore();
        render();
      } else if (form.id === 'metric-add-form' && user.isResearcher) {
        state.store.customMetrics.push({
          id: randomId('metric'),
          name: String(fd.get('name') || '').trim(),
          unit: String(fd.get('unit') || '').trim(),
          type: fd.get('type') === 'boolean' ? 'boolean' : 'number'
        });
        saveStore();
        setFeedback('ok', '새 측정 항목이 추가되었습니다.');
        render();
      } else if (form.id === 'research-log-form' && user.isResearcher) {
        const total = Math.max(1, Math.round(Number(fd.get('totalStudents') || 1)));
        const drowsy = Math.max(0, Math.min(total, Math.round(Number(fd.get('drowsyStudents') || 0))));
        const customValues = {};
        state.store.customMetrics.forEach(m => {
          const raw = fd.get('custom_' + m.id);
          if (m.type === 'boolean') customValues[m.id] = raw === 'true';
          else if (raw !== null && String(raw).trim() !== '') {
            const num = Number(raw);
            if (!isNaN(num)) customValues[m.id] = num;
          }
        });
        state.store.researchLogs.push({
          id: randomId('res'),
          recordedAt: new Date().toISOString(),
          sessionLabel: String(fd.get('sessionLabel') || '면학 측정').trim(),
          co2Ppm: Math.round(Number(fd.get('co2Ppm') || 1000)),
          totalStudents: total,
          drowsyStudents: drowsy,
          drowsyRate: Number(((drowsy / total) * 100).toFixed(1)),
          doorVentilation: String(fd.get('doorVentilation') || 'closed'),
          customValues,
          note: String(fd.get('note') || '').trim(),
          recordedBy: `${user.name} (${user.title})`
        });
        saveStore();
        setFeedback('ok', '환경 측정 수치가 기록되었습니다.');
        render();
      } else if (form.id === 'create-account-form' && user.role === 'leader') {
        const username = String(fd.get('username') || '').trim();
        const password = String(fd.get('password') || '');
        if (state.store.users.some(u => u.username.toLowerCase() === username.toLowerCase())) {
          setFeedback('err', '이미 존재하는 아이디입니다.');
          render();
          return;
        }
        const role = fd.get('role') === 'leader' ? 'leader' : 'student';
        const name = String(fd.get('name') || '').trim();
        let stuId;
        if (role === 'student') {
          let stu = state.store.students.find(s => s.name === name);
          if (!stu) {
            stu = { id: randomId('stu'), name, room: '미배정', grade: '2학년', createdAt: new Date().toISOString() };
            state.store.students.push(stu);
          }
          stuId = stu.id;
        }
        state.store.users.push({
          id: randomId('usr'),
          username,
          name,
          title: String(fd.get('title') || (role === 'leader' ? '방장' : '학생')).trim(),
          role,
          isResearcher: form.querySelector('[name="isResearcher"]').checked,
          room: '운영실',
          studentId: stuId,
          passwordHash: await hashPassword(password),
          createdAt: new Date().toISOString()
        });
        saveStore();
        setFeedback('ok', `${name} 계정이 발급되었습니다.`);
        render();
      } else if (form.id === 'add-student-form' && user.role === 'leader') {
        const name = String(fd.get('name') || '').trim();
        const room = String(fd.get('room') || '').trim();
        const grade = String(fd.get('grade') || '2학년').trim();
        const stu = { id: randomId('stu'), name, room, grade, createdAt: new Date().toISOString() };
        state.store.students.push(stu);
        state.store.extraStudyApplications.push({
          studentId: stu.id, studentName: stu.name, room: stu.room, choice: 'none',
          previousChoice: null, isChanged: false, changedAt: null, acknowledgedBy: null, acknowledgedAt: null, updatedAt: new Date().toISOString()
        });
        saveStore();
        setFeedback('ok', `${name} 학생이 명단에 추가되었습니다.`);
        render();
      }
    });

    // Live clock update on attendance screen
    setInterval(() => {
      const c1 = document.getElementById('live-att-clock');
      const c2 = document.getElementById('live-cam-clock');
      if (c1 || c2) {
        const t = formatKstDateTime(new Date().toISOString());
        if (c1) c1.textContent = t;
        if (c2) c2.textContent = '촬영 시각: ' + t;
      }
    }, 1000);

    // Boot
    hydrateAllMediaUrls(state.store).then(() => render());
    render();
  })();
  </script>
</body>
</html>
