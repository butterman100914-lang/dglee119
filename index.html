<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>면학마루 — 기숙사 면학실 통합 관리 및 환경 연구 시스템</title>
  <meta name="description" content="기숙사 면학시간 졸음·상벌점 관리, 추가 면학 신청, 방장 공지 게시판, 공휴일 출석 위치·시각 인증, 1:1 귓속말 및 이산화탄소 상관관계 연구 플랫폼" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet" />
  <style id="app-styles">
    :root {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-subtle: #f1f5f9;
      --border-hairline: #e2e8f0;
      --border-strong: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --accent-primary: #1d4ed8;
      --accent-primary-hover: #1e40af;
      --accent-dark: #0f172a;
      --status-green: #15803d;
      --status-green-bg: #f0fdf4;
      --status-green-border: #bbf7d0;
      --status-amber: #b45309;
      --status-amber-bg: #fffbeb;
      --status-amber-border: #fde68a;
      --status-red: #b91c1c;
      --status-red-bg: #fef2f2;
      --status-red-border: #fecaca;
      --font-display: "Plus Jakarta Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-sans: "DM Sans", "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
      --radius-md: 8px;
      --radius-lg: 12px;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1, h2, h3, h4 {
      font-family: var(--font-display);
      margin: 0;
      text-wrap: balance;
    }

    p { margin: 0; }

    button, input, select, textarea {
      font-family: inherit;
    }

    .mono-num {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
    }

    /* Layout */
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 32px;
      position: sticky;
      top: 0;
      z-index: 30;
    }

    .brand-mark {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-primary);
      background: none;
      border: none;
      padding: 0;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 20px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-links::-webkit-scrollbar { display: none; }

    .nav-link {
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 20px 2px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s ease, border-color 0.15s ease;
    }
    .nav-link:hover {
      color: var(--text-primary);
    }
    .nav-link.active {
      color: var(--accent-primary);
      border-bottom-color: var(--accent-primary);
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .mobile-nav {
      display: none;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-hairline);
      padding: 8px 16px;
      gap: 8px;
      overflow-x: auto;
    }

    .container {
      max-width: 1240px;
      width: 100%;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
    }

    .workspace-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 18px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-hairline);
    }

    .workspace-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .workspace-meta {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      text-decoration: none;
    }
    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent-primary);
      color: #ffffff;
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--accent-primary-hover);
    }
    .btn-dark {
      background: var(--accent-dark);
      color: #ffffff;
    }
    .btn-dark:hover:not(:disabled) {
      background: #1e293b;
    }
    .btn-outline {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
    }
    .btn-outline:hover:not(:disabled) {
      background: var(--bg-subtle);
    }
    .btn-amber {
      background: #d97706;
      color: #ffffff;
    }
    .btn-amber:hover:not(:disabled) {
      background: #b45309;
    }
    .btn-danger-ghost {
      background: transparent;
      color: var(--text-muted);
      padding: 6px 8px;
    }
    .btn-danger-ghost:hover:not(:disabled) {
      color: var(--status-red);
      background: var(--status-red-bg);
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 12px;
    }

    .input, .select, .textarea {
      width: 100%;
      padding: 8px 12px;
      font-size: 13.5px;
      color: var(--text-primary);
      background: var(--bg-surface);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .input:focus, .select:focus, .textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(29, 78, 216, 0.15);
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    /* Cards & Grids */
    .surface {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
    }
    .surface-pad {
      padding: 20px 24px;
    }
    .surface-head {
      padding: 18px 24px;
      border-bottom: 1px solid var(--border-hairline);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .kpi-grid-5 {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }
    .kpi-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
    }
    .kpi-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }
    .kpi-value {
      font-size: 24px;
      font-weight: 700;
      margin-top: 6px;
      color: var(--text-primary);
    }
    .kpi-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .split-12 {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 24px;
      align-items: start;
    }
    .col-span-7 { grid-column: span 7; }
    .col-span-5 { grid-column: span 5; }
    .col-span-8 { grid-column: span 8; }
    .col-span-4 { grid-column: span 4; }
    .col-span-6 { grid-column: span 6; }

    /* Segmented Filter Controls */
    .seg-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      background: var(--bg-subtle);
      border-radius: var(--radius-md);
    }
    .seg-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .seg-btn.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.08);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }
    th {
      padding: 11px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: #f8fafc;
      border-bottom: 1px solid var(--border-hairline);
      white-space: nowrap;
    }
    td {
      padding: 12px 14px;
      font-size: 13.5px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    tr.clickable { cursor: pointer; }
    tr.clickable:hover td { background: #f8fafc; }
    tr.row-selected td { background: #eff6ff; }
    tr.row-changed td { background: #fef3c7; }
    tr.row-changed:hover td { background: #fde68a; }

    .text-right { text-align: right; }
    .text-green { color: var(--status-green); }
    .text-amber { color: var(--status-amber); }
    .text-red { color: var(--status-red); }
    .text-blue { color: var(--accent-primary); }

    /* Alerts */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid;
      margin-bottom: 16px;
    }
    .alert-ok {
      background: var(--status-green-bg);
      border-color: var(--status-green-border);
      color: var(--status-green);
    }
    .alert-err {
      background: var(--status-red-bg);
      border-color: var(--status-red-border);
      color: var(--status-red);
    }
    .alert-warn {
      background: var(--status-amber-bg);
      border-color: var(--status-amber-border);
      color: var(--status-amber);
    }

    /* Auth Screen */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .auth-grid {
      max-width: 980px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      align-items: stretch;
    }
    .auth-hero {
      background: #0f172a;
      color: #f8fafc;
      border-radius: var(--radius-lg);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .auth-box {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      padding: 36px;
    }

    /* Whisper Chat */
    .whisper-shell {
      display: grid;
      grid-template-columns: 300px 1fr;
      min-height: 540px;
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .whisper-threads {
      border-right: 1px solid var(--border-hairline);
      display: flex;
      flex-direction: column;
    }
    .whisper-thread-item {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: 1px solid #f1f5f9;
      padding: 14px 16px;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .whisper-thread-item:hover { background: #f8fafc; }
    .whisper-thread-item.active { background: #eff6ff; }
    .whisper-pane {
      display: flex;
      flex-direction: column;
      background: #f8fafc;
    }
    .whisper-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      max-height: 410px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg-row {
      display: flex;
      flex-direction: column;
    }
    .msg-row.mine { align-items: flex-end; }
    .msg-row.theirs { align-items: flex-start; }
    .msg-bubble-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      max-width: 80%;
    }
    .msg-row.mine .msg-bubble-wrap { flex-direction: row-reverse; }
    .msg-bubble {
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-row.mine .msg-bubble {
      background: var(--accent-primary);
      color: #ffffff;
    }
    .msg-row.theirs .msg-bubble {
      background: #ffffff;
      border: 1px solid var(--border-hairline);
      color: var(--text-primary);
    }
    .msg-meta {
      font-size: 11px;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      padding-bottom: 2px;
    }
    .msg-row.mine .msg-meta { align-items: flex-end; }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-lg);
      max-width: 760px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 24px;
    }

    /* Responsive */
    @media (max-width: 1024px) {
      .kpi-grid, .kpi-grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .split-12 { grid-template-columns: 1fr; }
      .col-span-7, .col-span-5, .col-span-8, .col-span-4, .col-span-6 { grid-column: span 1; }
      .auth-grid { grid-template-columns: 1fr; }
      .whisper-shell { grid-template-columns: 1fr; }
      .whisper-threads { border-right: none; border-bottom: 1px solid var(--border-hairline); max-height: 220px; overflow-y: auto; }
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .mobile-nav { display: flex; }
      .topbar { padding: 0 16px; gap: 12px; }
      .container { padding: 16px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script id="app-script">
  (function () {
    'use strict';

    const STORAGE_KEY = 'myeonhak_maru_v1_store';
    const SESSION_KEY = 'myeonhak_maru_v1_session';
    const IDB_NAME = 'myeonhak_maru_media';
    const IDB_STORE = 'blobs';

    // Pure JS SHA-256 fallback so hashing works even under strict file:// contexts
    function sha256Fallback(ascii) {
      function rightRotate(value, amount) { return (value >>> amount) | (value << (32 - amount)); }
      const mathPow = Math.pow;
      const maxWord = mathPow(2, 32);
      const lengthProperty = 'length';
      let i, j, result = '';
      const words = [];
      const asciiBitLength = ascii[lengthProperty] * 8;
      let hash = [], k = [];
      let primeCounter = 0;
      const isComposite = {};
      for (let candidate = 2; primeCounter < 64; candidate++) {
        if (!isComposite[candidate]) {
          for (i = 0; i < 313; i += candidate) isComposite[i] = candidate;
          hash[primeCounter] = (mathPow(candidate, 0.5) * maxWord) | 0;
          k[primeCounter++] = (mathPow(candidate, 1 / 3) * maxWord) | 0;
        }
      }
      ascii += '\x80';
      while ((ascii[lengthProperty] % 64) - 56) ascii += '\x00';
      for (i = 0; i < ascii[lengthProperty]; i++) {
        j = ascii.charCodeAt(i);
        if (j >> 8) return '';
        words[i >> 2] |= j << (((3 - i) % 4) * 8);
      }
      words[words[lengthProperty]] = (asciiBitLength / maxWord) | 0;
      words[words[lengthProperty]] = asciiBitLength;
      for (j = 0; j < words[lengthProperty]; ) {
        const w = words.slice(j, (j += 16));
        const oldHash = hash;
        hash = hash.slice(0, 8);
        for (i = 0; i < 64; i++) {
          const w15 = w[i - 15], w2 = w[i - 2];
          const a = hash[0], e = hash[4];
          const temp1 = hash[7] + (rightRotate(e, 6) ^ rightRotate(e, 11) ^ rightRotate(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i] +
            (w[i] = i < 16 ? w[i] : (w[i - 16] + (rightRotate(w15, 7) ^ rightRotate(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rightRotate(w2, 17) ^ rightRotate(w2, 19) ^ (w2 >>> 10))) | 0);
          const temp2 = (rightRotate(a, 2) ^ rightRotate(a, 13) ^ rightRotate(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
          hash = [(temp1 + temp2) | 0].concat(hash);
          hash[4] = (hash[4] + temp1) | 0;
        }
        for (i = 0; i < 8; i++) hash[i] = (hash[i] + oldHash[i]) | 0;
      }
      for (i = 0; i < 8; i++) {
        for (j = 3; j + 1; j--) {
          const b = (hash[i] >> (j * 8)) & 255;
          result += (b < 16 ? 0 : '') + b.toString(16);
        }
      }
      return result;
    }

    async function sha256Hex(str) {
      if (window.crypto && window.crypto.subtle) {
        try {
          const bytes = new TextEncoder().encode(str);
          const buf = await window.crypto.subtle.digest('SHA-256', bytes);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
        } catch (e) {
          // fall back
        }
      }
      const utf8 = unescape(encodeURIComponent(str));
      return sha256Fallback(utf8);
    }

    function randomId(prefix) {
      return prefix + '-' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
    }

    async function hashPassword(password) {
      const salt = randomId('s');
      const digest = await sha256Hex(salt + ':' + password);
      return salt + ':' + digest;
    }

    async function verifyPassword(password, stored) {
      const parts = String(stored || '').split(':');
      if (parts.length !== 2) return false;
      const digest = await sha256Hex(parts[0] + ':' + password);
      return digest === parts[1];
    }

    // IndexedDB Media Store (for photos & videos so localStorage never overflows)
    const mediaUrlCache = new Map();

    function openMediaDb() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error('IndexedDB unavailable'));
          return;
        }
        const req = indexedDB.open(IDB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains(IDB_STORE)) {
            db.createObjectStore(IDB_STORE);
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function saveMediaBlob(id, blob) {
      try {
        const db = await openMediaDb();
        await new Promise((resolve, reject) => {
          const tx = db.transaction(IDB_STORE, 'readwrite');
          tx.objectStore(IDB_STORE).put(blob, id);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
        mediaUrlCache.set(id, URL.createObjectURL(blob));
        return true;
      } catch (e) {
        // Fallback: store small dataUrl in cache/store
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => {
            mediaUrlCache.set(id, String(reader.result));
            resolve(true);
          };
          reader.readAsDataURL(blob);
        });
      }
    }

    async function hydrateAllMediaUrls(store) {
      const ids = [];
      store.notices.forEach(n => (n.attachments || []).forEach(a => ids.push(a.id)));
      store.attendanceCheckins.forEach(c => ids.push(c.mediaId));
      const missing = ids.filter(id => id && !mediaUrlCache.has(id));
      if (missing.length === 0) return false;
      try {
        const db = await openMediaDb();
        let loaded = false;
        await Promise.all(missing.map(id => new Promise((resolve) => {
          const tx = db.transaction(IDB_STORE, 'readonly');
          const req = tx.objectStore(IDB_STORE).get(id);
          req.onsuccess = () => {
            if (req.result) {
              mediaUrlCache.set(id, URL.createObjectURL(req.result));
              loaded = true;
            }
            resolve();
          };
          req.onerror = () => resolve();
        })));
        return loaded;
      } catch (e) {
        return false;
      }

    // Security helper: escape HTML before rendering
    function esc(str) {
      return String(str == null ? '' : str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function isoDaysAgo(days, hour, minute) {
      const d = new Date(Date.now() - days * 86400000);
      d.setHours(hour, minute, 0, 0);
      return d.toISOString();
    }

    function formatKstDateTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso || '');
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(d);
    }

    function formatKstTime(iso) {
      const d = new Date(iso);
      if (isNaN(d.getTime())) return String(iso || '');
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(d);
    }

    function getKstMinutes() {
      const formatted = new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Asia/Seoul',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(new Date());
      const parts = formatted.split(':').map(Number);
      return (parts[0] || 0) * 60 + (parts[1] || 0);
    }

    function isPastDeadline(config) {
      if (!config.deadlineEnabled) return false;
      const m = /^(\d{2}):(\d{2})$/.exec(String(config.extraStudyDeadline || '').trim());
      const deadlineMin = m ? Number(m[1]) * 60 + Number(m[2]) : 24 * 60;
      const nowMin = getKstMinutes();
      if (deadlineMin >= 12 * 60) {
        return nowMin >= deadlineMin || nowMin < 6 * 60;
      }
      if (nowMin >= 12 * 60) return false;
      return nowMin >= deadlineMin;
    }

        if (!raw) {
          const initial = createInitialStore();
          localStorage.setItem(STORAGE_KEY, JSON.stringify(initial));
          return initial;
        }
        return JSON.parse(raw);
      } catch (e) {
        return createInitialStore();
      }
    }

      const styles = document.getElementById('app-styles')?.textContent || '';

      const html = [
        '<!doctype html>',
        '<html lang="ko">',

        '<body>',
        '  <div id="app"></div>',
        '  <script id="app-script">' + script + '<\/script>',
        '</body>',
        '</html>'
      ].join('\n');

      const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'index.html';

    // ==================== TAB 1: OVERVIEW (DROWSINESS & MERIT/DEMERIT) ====================
    function computeStudentStats() {
      const limit = state.store.config.maxDrowsyLimit;
      return state.store.students.map(stu => {
        const logs = state.store.behaviorLogs
          .filter(l => l.studentId === stu.id)
          .slice()
          .sort((a, b) => new Date(a.recordedAt).getTime() - new Date(b.recordedAt).getTime());

        const drowsyCount = logs.filter(l => l.type === 'drowsy').length;
        const otherLogs = logs.filter(l => l.type === 'demerit');
        const meritLogs = logs.filter(l => l.type === 'merit');
        const totalMerit = meritLogs.reduce((s, l) => s + Math.max(0, l.pointsDelta), 0);
        const totalDemerit = logs.filter(l => l.pointsDelta < 0).reduce((s, l) => s + Math.abs(l.pointsDelta), 0);
        const netScore = totalMerit - totalDemerit;
        const issueCounts = {};
        otherLogs.forEach(l => {
          issueCounts[l.label] = (issueCounts[l.label] || 0) + 1;
        });

        return {
          student: stu,
          logs,
          drowsyCount,
          otherCount: otherLogs.length,
          issueCounts,
          totalMerit,
          totalDemerit,
          netScore,
          isBlocked: drowsyCount >= limit
        };
      });
    }

    function renderScoreTrendSvg(logs) {
      if (logs.length === 0) {
        return `<div style="height:160px;border:1px dashed var(--border-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text-muted)">아직 기록된 상·벌점 내역이 없습니다.</div>`;
      }

      let runMerit = 0, runDemerit = 0;
      const points = logs.map((log, idx) => {
        if (log.pointsDelta >= 0) runMerit += log.pointsDelta;
        else runDemerit += Math.abs(log.pointsDelta);
        return { idx, log, net: runMerit - runDemerit };
      });

      const w = 460, h = 185, pL = 36, pR = 16, pT = 18, pB = 26;
      const plotW = w - pL - pR, plotH = h - pT - pB;
      const nets = points.map(p => p.net);
      const minY = Math.min(0, ...nets) - 1;
      const maxY = Math.max(2, ...nets) + 1;
      const spanY = Math.max(1, maxY - minY);

      const gx = i => points.length === 1 ? pL + plotW / 2 : pL + (i / (points.length - 1)) * plotW;
      const gy = v => pT + ((maxY - v) / spanY) * plotH;
      const zeroY = gy(0);
      const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${gx(i).toFixed(1)} ${gy(p.net).toFixed(1)}`).join(' ');
      const hovered = points.find(p => p.log.id === state.hoveredScoreLogId) || null;

      return `
        <div style="border:1px solid var(--border-hairline);border-radius:8px;background:#f8fafc;padding:8px">
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:175px;overflow:visible">
            <line x1="${pL}" y1="${zeroY}" x2="${w - pR}" y2="${zeroY}" stroke="#94a3b8" stroke-dasharray="3 3" stroke-width="1" />
            <text x="${pL - 6}" y="${zeroY + 3}" text-anchor="end" fill="#64748b" font-size="10" font-family="monospace">0</text>
            <text x="${pL - 6}" y="${pT + 4}" text-anchor="end" fill="#94a3b8" font-size="10" font-family="monospace">${maxY}</text>
            <text x="${pL - 6}" y="${h - pB}" text-anchor="end" fill="#94a3b8" font-size="10" font-family="monospace">${minY}</text>
            ${points.length > 1 ? `<path d="${pathD}" fill="none" stroke="#1d4ed8" stroke-width="2" />` : ''}
            ${points.map(p => {
              const c = p.log.type === 'merit' ? '#16a34a' : p.log.type === 'drowsy' ? '#d97706' : '#dc2626';
              const active = state.hoveredScoreLogId === p.log.id;
              return `
                <circle cx="${gx(p.idx)}" cy="${gy(p.net)}" r="${active ? 6 : 4.5}" fill="${c}" stroke="#fff" stroke-width="1.5"
                  style="cursor:pointer" data-hover-score="${esc(p.log.id)}" />
                <text x="${gx(p.idx)}" y="${h - 6}" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">${p.idx + 1}회</text>
              `;
            }).join('')}
          </svg>
          ${hovered ? `
            <div style="margin-top:4px;padding:8px 10px;background:#fff;border:1px solid var(--border-hairline);border-radius:6px;display:flex;justify-content:space-between;font-size:12px">
              <span><strong>${esc(hovered.log.label)}</strong> · <span class="mono-num">${esc(formatKstDateTime(hovered.log.recordedAt))}</span></span>
              <span class="mono-num"><strong>${hovered.log.pointsDelta > 0 ? '+' + hovered.log.pointsDelta : hovered.log.pointsDelta}점</strong> (누적 ${hovered.net > 0 ? '+' + hovered.net : hovered.net}점)</span>
            </div>
          ` : ''}
        </div>
      `;
    }

                <div style="padding:10px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px">
                  <div style="font-size:11px;color:var(--text-muted)">졸음</div>
                  <div class="mono-num" style="font-size:15px;font-weight:700;margin-top:2px">${detail.drowsyCount}/${limit}</div>
                </div>
                <div style="padding:10px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px">
                  <div style="font-size:11px;color:var(--text-muted)">상점</div>
                  <div class="mono-num text-green" style="font-size:15px;font-weight:700;margin-top:2px">+${detail.totalMerit}</div>
                </div>
                <div style="padding:10px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px">
                  <div style="font-size:11px;color:var(--text-muted)">벌점</div>
                  <div class="mono-num text-red" style="font-size:15px;font-weight:700;margin-top:2px">-${detail.totalDemerit}</div>
                </div>
                <div style="padding:10px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px">
                  <div style="font-size:11px;color:var(--text-muted)">총점</div>
                  <div class="mono-num ${detail.netScore >= 0 ? 'text-blue' : 'text-red'}" style="font-size:15px;font-weight:700;margin-top:2px">${detail.netScore > 0 ? '+' + detail.netScore : detail.netScore}</div>
                </div>
              </div>

              <div style="margin-bottom:16px">
                <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">졸음 외 항목별 체크 횟수</div>
                ${Object.keys(detail.issueCounts).length === 0
                  ? '<p style="font-size:12px;color:var(--text-muted)">기타 생활 규정 위반 기록이 없습니다.</p>'
                  : `<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px">${Object.entries(detail.issueCounts).map(([lbl, cnt]) => `<span>${esc(lbl)} <strong class="mono-num text-red">${cnt}회</strong></span>`).join('')}</div>`
                }
              </div>

              <div style="margin-bottom:16px">
                <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px">
                  <strong style="color:var(--text-secondary)">상·벌점 누적 총점 변화 그래프</strong>
                  <span style="color:var(--text-muted)">점 hover 시 시각·사유 표시</span>
                </div>
                ${renderScoreTrendSvg(detail.logs)}
              </div>

              <div>
                <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:6px">전체 체크 시점 및 상세 내역 (${detail.logs.length}건)</div>
                <div style="max-height:240px;overflow-y:auto;border:1px solid var(--border-hairline);border-radius:8px">
                  ${detail.logs.length === 0 ? '<div style="padding:24px;text-align:center;font-size:12px;color:var(--text-muted)">기록이 없습니다.</div>' : detail.logs.slice().reverse().map(log => `
                    <div style="padding:10px 12px;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;font-size:12px">
                      <div>
                        <div>
                          <strong class="${log.type === 'merit' ? 'text-green' : log.type === 'drowsy' ? 'text-amber' : 'text-red'}">${esc(log.label)}</strong>
                          <span style="color:var(--text-muted)"> · </span>
                          <strong class="mono-num">${log.pointsDelta > 0 ? '+' + log.pointsDelta : log.pointsDelta}점</strong>
                        </div>
                        ${log.note ? `<div style="color:var(--text-secondary);margin-top:2px">${esc(log.note)}</div>` : ''}
                        <div class="mono-num" style="color:var(--text-muted);font-size:11px;margin-top:3px">
                          ${esc(formatKstDateTime(log.recordedAt))} · 기록: ${esc(log.recordedByName)}
                        </div>
                      </div>
                      ${isLeader ? `<button type="button" class="btn btn-danger-ghost" data-action="delete-behavior" data-log-id="${esc(log.id)}" title="삭제">${svgIcon('trash', 14)}</button>` : ''}
                    </div>
                  `).join('')}
                </div>
              </div>
            ` : '<div style="padding:40px;text-align:center;font-size:13px;color:var(--text-muted)">학생을 선택해 주세요.</div>'}
          </section>
        </div>
      `;
    }

    // ==================== TAB 2: EXTRA STUDY ====================
    function renderExtraStudyTab(user) {
      const isLeader = user.role === 'leader';
      const cfg = state.store.config;
      const deadlinePassed = isPastDeadline(cfg);
      const rows = state.store.students.map(stu => {
        const app = state.store.extraStudyApplications.find(a => a.studentId === stu.id) || {
          studentId: stu.id, studentName: stu.name, room: stu.room, choice: 'none',
          previousChoice: null, isChanged: false, changedAt: null, acknowledgedBy: null, acknowledgedAt: null, updatedAt: stu.createdAt
        };
        const drowsyCount = getDrowsyCount(stu.id);
        return { student: stu, app, drowsyCount, isBlocked: drowsyCount >= cfg.maxDrowsyLimit };
      });

      const counts = {
        total: rows.length,
        oneAm: rows.filter(r => r.app.choice === '1am').length,
        twoAm: rows.filter(r => r.app.choice === '2am').length,
        none: rows.filter(r => r.app.choice === 'none').length,
        changed: rows.filter(r => r.app.isChanged).length
      };

      const filtered = rows.filter(r => {
        if (state.extraFilter === 'changed') return r.app.isChanged;
        if (state.extraFilter === '1am') return r.app.choice === '1am';
        if (state.extraFilter === '2am') return r.app.choice === '2am';
        if (state.extraFilter === 'none') return r.app.choice === 'none';
        return true;
      });

      const myRow = user.studentId ? rows.find(r => r.student.id === user.studentId) : null;

      return `
        <div class="kpi-grid-5">
          <div class="kpi-card">
            <div class="kpi-label">새벽 1시까지</div>
            <div class="kpi-value mono-num text-blue">${counts.oneAm}명</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">새벽 2시까지</div>
            <div class="kpi-value mono-num" style="color:#4338ca">${counts.twoAm}명</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">미신청 (불참)</div>
            <div class="kpi-value mono-num">${counts.none}명</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">변경 후 방장 미확인</div>
            <div class="kpi-value mono-num ${counts.changed > 0 ? 'text-amber' : ''}">${counts.changed}건</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">신청 마감 기준</div>
            <div class="mono-num" style="font-size:17px;font-weight:700;margin-top:6px">
              ${cfg.deadlineEnabled ? esc(cfg.extraStudyDeadline) + ' 마감' : '마감 제한 없음'}
            </div>
            <div style="font-size:12px;font-weight:600;margin-top:4px" class="${deadlinePassed ? 'text-red' : 'text-green'}">
              ${deadlinePassed ? '현재 마감됨 (수정 불가)' : '현재 신청 가능'}
            </div>
          </div>
        </div>

        ${isLeader ? `
          <section class="surface surface-pad" style="margin-bottom:24px">
            <form id="deadline-form" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px">
              <div>
                <h2 style="font-size:14.5px;font-weight:700">추가 면학 신청 마감 시간 설정</h2>
                <p style="font-size:12px;color:var(--text-muted);margin-top:2px">설정한 시각(예: 24:00 밤 12시) 이후에는 학생이 직접 신청을 변경할 수 없습니다.</p>
              </div>
              <div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
                <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;cursor:pointer">
                  <input type="checkbox" name="deadlineEnabled" ${cfg.deadlineEnabled ? 'checked' : ''} />
                  마감 제한 사용
                </label>
                <input class="input mono-num" name="extraStudyDeadline" value="${esc(cfg.extraStudyDeadline)}" pattern="^(?:[01]\\d|2[0-4]):[0-5]\\d$" style="width:92px;padding:6px 10px" placeholder="24:00" />
                <button type="submit" class="btn btn-dark btn-sm">마감 시간 저장</button>
              </div>
            </form>
          </section>
        ` : ''}

        ${myRow ? `
          <section class="surface surface-pad" style="margin-bottom:24px;${myRow.app.isChanged ? 'background:#fffbeb;border-color:#fcd34d' : ''}">
            <div style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px">
              <div>
                <div style="font-size:12px;color:var(--text-muted)">${esc(myRow.student.room)} · 졸음 누적 ${myRow.drowsyCount}/${cfg.maxDrowsyLimit}회</div>
                <h2 style="font-size:16px;font-weight:700;margin-top:2px">${esc(myRow.student.name)} 학생 내 추가 면학 신청</h2>
                <div style="font-size:12.5px;margin-top:6px">
                  ${myRow.isBlocked
                    ? `<span class="text-red" style="font-weight:600">졸음 횟수 제한(${cfg.maxDrowsyLimit}회) 도달로 추가 면학 신청이 차단되었습니다.</span>`
                    : deadlinePassed
                      ? `<span class="text-red" style="font-weight:600">마감 시간(${esc(cfg.extraStudyDeadline)})이 지나 수정할 수 없습니다.</span>`
                      : myRow.app.isChanged
                        ? `<span class="text-amber" style="font-weight:600">신청 변경됨 (${esc(choiceLabel(myRow.app.previousChoice || 'none'))} → ${esc(choiceLabel(myRow.app.choice))}) · 방장 확인 대기 중</span>`
                        : myRow.app.acknowledgedBy
                          ? `<span class="text-green" style="font-weight:600">방장 확인 완료 (${esc(myRow.app.acknowledgedBy)} · ${esc(formatKstDateTime(myRow.app.acknowledgedAt))})</span>`
                          : `<span style="color:var(--text-secondary)">불참, 새벽 1시, 새벽 2시 중 하나를 선택하세요.</span>`
                  }
                </div>
              </div>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                ${['none', '1am', '2am'].map(opt => {
                  const disabled = deadlinePassed || (myRow.isBlocked && opt !== 'none');
                  const active = myRow.app.choice === opt;
                  return `<button type="button" class="btn ${active ? 'btn-primary' : 'btn-outline'}" ${disabled ? 'disabled' : ''} data-action="set-extra-choice" data-student-id="${esc(myRow.student.id)}" data-choice="${opt}">${choiceLabel(opt)}</button>`;
                }).join('')}
              </div>
            </div>
          </section>
        ` : ''}

        <section class="surface" style="overflow:hidden">
          <div class="surface-head">
            <div>
              <h2 style="font-size:15px;font-weight:700">전체 학생 추가 면학 신청 현황</h2>
              <p style="font-size:12px;color:var(--text-muted);margin-top:2px">중간에 신청을 바꾸면 행 전체가 노란색으로 강조되며, 방장이 확인 완료를 누르면 색깔이 사라집니다.</p>
            </div>
            <div class="seg-group">
              <button type="button" class="seg-btn ${state.extraFilter === 'all' ? 'active' : ''}" data-action="extra-filter" data-filter="all">전체 (${counts.total})</button>
              <button type="button" class="seg-btn ${state.extraFilter === 'changed' ? 'active' : ''}" data-action="extra-filter" data-filter="changed">변경 미확인 (${counts.changed})</button>
              <button type="button" class="seg-btn ${state.extraFilter === '1am' ? 'active' : ''}" data-action="extra-filter" data-filter="1am">1시 (${counts.oneAm})</button>
              <button type="button" class="seg-btn ${state.extraFilter === '2am' ? 'active' : ''}" data-action="extra-filter" data-filter="2am">2시 (${counts.twoAm})</button>
              <button type="button" class="seg-btn ${state.extraFilter === 'none' ? 'active' : ''}" data-action="extra-filter" data-filter="none">미신청 (${counts.none})</button>
            </div>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>학생 / 호실</th>
                  <th>졸음 제한 상태</th>
                  <th>신청 선택</th>
                  <th>변경 및 방장 확인 상태</th>
                  ${isLeader ? '<th class="text-right">방장 확인</th>' : ''}
                </tr>
              </thead>
              <tbody>
                ${filtered.map(({ student, app, drowsyCount, isBlocked }) => `
                  <tr class="${app.isChanged ? 'row-changed' : ''}">
                    <td>
                      <div style="font-weight:600">${esc(student.name)}</div>
                      <div style="font-size:12px;color:var(--text-muted)">${esc(student.room)} · ${esc(student.grade)}</div>
                    </td>
                    <td style="font-size:12px">
                      ${isBlocked
                        ? `<span class="text-red" style="font-weight:600">신청 제한 (${drowsyCount}/${cfg.maxDrowsyLimit}회)</span>`
                        : `<span class="mono-num" style="color:var(--text-secondary)">정상 (${drowsyCount}/${cfg.maxDrowsyLimit}회)</span>`
                      }
                    </td>
                    <td>
                      ${isLeader ? `
                        <div class="seg-group">
                          ${['none', '1am', '2am'].map(opt => `
                            <button type="button" class="seg-btn ${app.choice === opt ? 'active' : ''}"
                              ${isBlocked && opt !== 'none' ? 'disabled' : ''}
                              data-action="set-extra-choice" data-student-id="${esc(student.id)}" data-choice="${opt}">
                              ${opt === 'none' ? '미신청' : opt === '1am' ? '1시' : '2시'}
                            </button>
                          `).join('')}
                        </div>
                      ` : `<strong class="${app.choice === 'none' ? '' : 'text-blue'}" style="font-size:12.5px">${choiceLabel(app.choice)}</strong>`}
                    </td>
                    <td style="font-size:12px">
                      ${app.isChanged
                        ? `<div class="text-amber" style="font-weight:600">변경됨 · 방장 확인 대기 (${choiceLabel(app.previousChoice || 'none')} → ${choiceLabel(app.choice)})</div>
                           <div class="mono-num" style="font-size:11px;color:#92400e;margin-top:2px">변경 시각: ${esc(formatKstDateTime(app.changedAt))}</div>`
                        : app.acknowledgedBy
                          ? `<div class="text-green" style="font-weight:600">방장 확인 완료 · ${esc(app.acknowledgedBy)}</div>
                             <div class="mono-num" style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(formatKstDateTime(app.acknowledgedAt))}</div>`
                          : `<span class="mono-num" style="color:var(--text-muted)">${esc(formatKstDateTime(app.updatedAt))}</span>`
                      }
                    </td>
                    ${isLeader ? `
                      <td class="text-right">
                        ${app.isChanged
                          ? `<button type="button" class="btn btn-amber btn-sm" data-action="ack-extra" data-student-id="${esc(student.id)}">${svgIcon('check', 14)}<span>확인 완료</span></button>`
                          : `<span style="font-size:12px;color:var(--text-muted)">확인됨</span>`
                        }
                      </td>
                    ` : ''}
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ==================== TAB 3: NOTICE BOARD ====================
    function renderNoticesTab(user) {
      const isLeader = user.role === 'leader';
      return `
        ${isLeader ? `
          <section class="surface surface-pad" style="margin-bottom:24px">
            <div style="padding-bottom:14px;border-bottom:1px solid #f1f5f9">
              <h2 style="font-size:15px;font-weight:700">기숙사 일정 및 공지 작성</h2>
              <p style="font-size:12px;color:var(--text-muted);margin-top:2px">
                현재 로그인한 <strong>${esc(user.name)} (${esc(user.title)})</strong> 명의로 등록됩니다. 사진과 동영상을 함께 올릴 수 있습니다.
              </p>
            </div>
            <form id="notice-form" style="margin-top:14px;display:flex;flex-direction:column;gap:12px">
              <div style="display:grid;grid-template-columns:2fr 1fr;gap:12px">
                <div>
                  <label class="label">공지 제목</label>
                  <input class="input" name="title" required placeholder="예: 11월 기숙사 대청소 및 환기 일정" />
                </div>
                <div>
                  <label class="label">관련 일정 날짜 (선택)</label>
                  <input class="input mono-num" type="date" name="scheduleDate" />
                </div>
              </div>
              <div>
                <label class="label">공지 내용</label>
                <textarea class="textarea" name="content" rows="4" required placeholder="학생들에게 안내할 일정 및 공지 내용을 입력하세요."></textarea>
              </div>
              <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px">
                <input type="file" name="files" id="notice-files" multiple accept="image/*,video/*" style="font-size:12.5px" />
                <button type="submit" class="btn btn-primary">${svgIcon('send', 14)}<span>${esc(user.name)} 명의로 공지 올리기</span></button>
              </div>
            </form>
          </section>
        ` : ''}

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h2 style="font-size:15px;font-weight:700">기숙사 공지 · 앞으로의 일정 (${state.store.notices.length}건)</h2>
        </div>

        <div style="display:flex;flex-direction:column;gap:16px">
          ${state.store.notices.length === 0 ? '<div class="surface surface-pad" style="text-align:center;color:var(--text-muted);font-size:13px">등록된 공지가 없습니다.</div>' : state.store.notices.map(n => `
            <article class="surface surface-pad">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
                <div>
                  <div style="font-size:12px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center">
                    <strong class="text-blue">작성자: ${esc(n.authorName)} (${esc(n.authorTitle)})</strong>
                    <span>·</span>
                    <span class="mono-num">${esc(formatKstDateTime(n.createdAt))}</span>
                    ${n.scheduleDate ? `<span>·</span><strong class="mono-num" style="color:var(--text-primary)">예정 일정: ${esc(n.scheduleDate)}</strong>` : ''}
                  </div>
                  <h3 style="font-size:17px;font-weight:700;margin-top:6px">${esc(n.title)}</h3>
                </div>
                ${isLeader ? `<button type="button" class="btn btn-danger-ghost" data-action="delete-notice" data-notice-id="${esc(n.id)}">${svgIcon('trash', 15)}</button>` : ''}
              </div>
              <p style="margin-top:12px;font-size:14px;color:var(--text-secondary);white-space:pre-line;line-height:1.6">${esc(n.content)}</p>
              ${(n.attachments && n.attachments.length > 0) ? `
                <div style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px">
                  ${n.attachments.map(att => {
                    const url = mediaUrlCache.get(att.id) || att.fallbackUrl || '';
                    if (!url) return '';
                    return att.kind === 'video'
                      ? `<div style="border:1px solid var(--border-hairline);border-radius:8px;overflow:hidden;background:#020617"><video src="${esc(url)}" controls playsinline style="width:100%;max-height:220px"></video><div style="padding:6px 10px;font-size:11px;color:#cbd5e1">${esc(att.originalName)}</div></div>`
                      : `<button type="button" data-action="open-lightbox" data-url="${esc(url)}" style="border:1px solid var(--border-hairline);border-radius:8px;overflow:hidden;background:#fff;padding:0;cursor:pointer;text-align:left"><img src="${esc(url)}" alt="${esc(att.originalName)}" style="width:100%;height:190px;object-fit:cover;display:block" /><div style="padding:6px 10px;font-size:11px;color:var(--text-secondary)">${esc(att.originalName)}</div></button>`;
                  }).join('')}
                </div>
              ` : ''}
            </article>
          `).join('')}
        </div>

        ${state.lightboxUrl ? `
          <div class="modal-backdrop" data-action="close-lightbox">
            <img src="${esc(state.lightboxUrl)}" alt="확대 이미지" style="max-width:92vw;max-height:86vh;border-radius:10px" />
          </div>
        ` : ''}
      `;
    }

    // ==================== TAB 4: ATTENDANCE CAMERA & GPS ====================
    function renderAttendanceTab(user) {
      const isLeader = user.role === 'leader';
      const nowStr = formatKstDateTime(new Date().toISOString());

      return `
        <section class="surface surface-pad" style="margin-bottom:24px">
          <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid #f1f5f9">
            <div>
              <h2 style="font-size:15px;font-weight:700">공휴일 학원 현장 출석 인증 (시각·위치 조작 방지)</h2>
              <p style="font-size:12px;color:var(--text-muted);margin-top:2px">
                저장된 사진 파일 업로드는 허용되지 않습니다. 실시간 카메라 촬영 시 현재 시각과 GPS 위치가 화면과 사진에 함께 고정 기록됩니다.
              </p>
            </div>
            ${isLeader ? `
              <div style="display:flex;align-items:center;gap:8px">
                <span style="font-size:12px;color:var(--text-muted)">대상 학생:</span>
                <select class="select" id="attendance-student-select" style="width:160px;padding:6px 10px;font-size:12px">
                  ${state.store.students.map(s => `<option value="${esc(s.id)}">${esc(s.name)} (${esc(s.room)})</option>`).join('')}
                </select>
              </div>
            ` : ''}
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0">
            <div style="padding:14px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px;display:flex;justify-content:space-between;align-items:center">
              <div>
                <div style="font-size:11.5px;font-weight:600;color:var(--text-muted)">현재 표준 시각 (수정 불가)</div>
                <div id="live-att-clock" class="mono-num" style="font-size:15px;font-weight:700;margin-top:4px">${esc(nowStr)}</div>
              </div>
              ${svgIcon('clock', 20)}
            </div>
            <div style="padding:14px;background:#f8fafc;border:1px solid var(--border-hairline);border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:10px">
              <div style="min-width:0">
                <div style="font-size:11.5px;font-weight:600;color:var(--text-muted)">실시간 GPS 위치 (자동 수신)</div>
                <div style="font-size:13.5px;font-weight:700;margin-top:4px">${state.geo.status === 'loading' ? '위치 수신 중...' : esc(state.geo.label)}</div>
                ${state.geo.lat !== null ? `<div class="mono-num" style="font-size:11px;color:var(--text-muted);margin-top:2px">위도 ${state.geo.lat} · 경도 ${state.geo.lng} · 오차 ±${state.geo.acc}m</div>` : ''}
                ${state.geo.err ? `<div style="font-size:11px;color:var(--status-red);margin-top:2px">${esc(state.geo.err)}</div>` : ''}
              </div>
              <button type="button" class="btn btn-outline btn-sm" data-action="refresh-geo">위치 갱신</button>
            </div>
          </div>

          ${!state.cameraActive ? `
            <div style="border:1px dashed var(--border-strong);border-radius:10px;background:#f8fafc;padding:36px 20px;text-align:center">
              <div style="color:var(--text-muted);margin-bottom:10px">${svgIcon('camera', 34)}</div>
              <div style="font-size:14px;font-weight:600">실시간 카메라를 켜고 학원 현장을 촬영하세요</div>
              <p style="font-size:12px;color:var(--text-muted);margin-top:4px">촬영 순간의 시각과 GPS 위치가 사진 하단에 영구 각인됩니다.</p>
              <button type="button" class="btn btn-primary" style="margin-top:14px" data-action="start-camera">
                ${svgIcon('camera', 15)}<span>카메라 및 위치 인증 시작</span>
              </button>
              ${state.cameraError ? `<div style="margin-top:12px;font-size:12px;color:var(--status-red);font-weight:500">${esc(state.cameraError)}</div>` : ''}
            </div>
          ` : `
            <div>
              <div style="position:relative;border-radius:10px;overflow:hidden;background:#020617;border:1px solid #1e293b">
                <video id="att-video" autoplay playsinline muted style="width:100%;max-height:400px;object-fit:contain;display:block;margin:0 auto"></video>
                <div style="position:absolute;bottom:0;left:0;right:0;padding:14px 18px;background:linear-gradient(to top,rgba(2,6,23,0.9),transparent);color:#fff;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:12px">
                  <span id="live-cam-clock" class="mono-num" style="font-weight:700">촬영 시각: ${esc(nowStr)}</span>
                  <span>위치: ${esc(state.geo.label)}</span>
                </div>
              </div>
              <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:14px">
                <button type="button" class="btn btn-outline" data-action="stop-camera">카메라 닫기</button>
                <button type="button" class="btn btn-primary" data-action="capture-attendance">${svgIcon('checkCircle', 15)}<span>사진 촬영 및 시각·위치 인증 제출</span></button>
              </div>
            </div>
          `}
        </section>

        <h2 style="font-size:15px;font-weight:700;margin-bottom:14px">인증 완료된 학원 출석 기록 (${state.store.attendanceCheckins.length}건)</h2>
        ${state.store.attendanceCheckins.length === 0 ? '<div class="surface surface-pad" style="text-align:center;color:var(--text-muted);font-size:13px">아직 제출된 출석 인증 사진이 없습니다.</div>' : `
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px">
            ${state.store.attendanceCheckins.map(item => {
              const url = mediaUrlCache.get(item.mediaId) || item.fallbackUrl || '';
              return `
                <article class="surface" style="overflow:hidden">
                  ${url ? `<img src="${esc(url)}" alt="출석 인증" style="width:100%;height:220px;object-fit:cover;display:block;background:#020617" />` : ''}
                  <div style="padding:16px;font-size:12.5px">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                      <strong style="font-size:14px">${esc(item.studentName)} (${esc(item.room)})</strong>
                      <span class="text-green" style="font-weight:600;display:inline-flex;align-items:center;gap:4px">${svgIcon('checkCircle', 14)} 인증 완료</span>
                    </div>
                    <div style="border-top:1px solid #f1f5f9;padding-top:10px;display:flex;flex-direction:column;gap:6px">
                      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">인증 시각</span><strong class="mono-num">${esc(formatKstDateTime(item.capturedAt))}</strong></div>
                      <div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-muted)">인증 위치</span><strong style="text-align:right">${esc(item.locationLabel)}</strong></div>
                      ${item.latitude !== null ? `
                        <div style="display:flex;justify-content:space-between">
                          <span style="color:var(--text-muted)">GPS 좌표</span>
                          <a class="mono-num text-blue" href="https://maps.google.com/?q=${item.latitude},${item.longitude}" target="_blank" rel="noreferrer">${item.latitude}, ${item.longitude} (±${item.accuracy}m)</a>
                        </div>
                      ` : ''}
                      <div style="display:flex;justify-content:space-between"><span style="color:var(--text-muted)">무결성 코드</span><span class="mono-num" style="color:var(--text-secondary)">${esc(item.verificationCode)}</span></div>
                    </div>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    // ==================== TAB 5: WHISPER CHAT ====================
    function markActiveWhisperRead(user, threadKey) {
      if (!threadKey) return;
      const now = new Date().toISOString();
      let changed = false;
      state.store.whisperMessages.forEach(m => {
        if (m.threadKey === threadKey && m.senderUserId !== user.id && !m.readByRecipient) {
          m.readByRecipient = true;
          m.readAt = now;
          changed = true;
        }
      });
      if (changed) saveStore();
    }

    function renderWhisperTab(user) {
      const isLeader = user.role === 'leader';
      const partners = isLeader
        ? state.store.users.filter(u => u.role === 'student').map(u => ({ id: u.id, name: u.name, sub: u.room }))
        : state.store.users.filter(u => u.role === 'leader').map(u => ({ id: u.id, name: u.name, sub: u.title }));

      if (!state.whisperPartnerId && partners.length > 0) {
        state.whisperPartnerId = partners[0].id;
      }

      const activePartner = partners.find(p => p.id === state.whisperPartnerId) || null;
      const activeThreadKey = activePartner
        ? (isLeader ? `${activePartner.id}__${user.id}` : `${user.id}__${activePartner.id}`)
        : '';

      if (activeThreadKey) {
        markActiveWhisperRead(user, activeThreadKey);
      }

      const threadMsgs = activeThreadKey
        ? state.store.whisperMessages.filter(m => m.threadKey === activeThreadKey)
        : [];

      const unreadFrom = {};
      state.store.whisperMessages.forEach(m => {
        if (m.senderUserId !== user.id && !m.readByRecipient && m.threadKey.includes(user.id)) {
          unreadFrom[m.senderUserId] = (unreadFrom[m.senderUserId] || 0) + 1;
        }
      });

      return `
        <div class="whisper-shell">
          <aside class="whisper-threads">
            <div style="padding:14px 16px;border-bottom:1px solid var(--border-hairline)">
              <h2 style="font-size:14px;font-weight:700">${isLeader ? '학생 1:1 귓속말 함' : '방장 1:1 귓속말 선택'}</h2>
              <p style="font-size:12px;color:var(--text-muted);margin-top:2px">
                ${isLeader ? '학생을 선택해 답변하면 읽음 상태가 즉시 반영됩니다.' : '문의할 방장을 선택해 비공개로 질문하세요.'}
              </p>
            </div>
            <div style="overflow-y:auto;flex:1">
              ${partners.length === 0 ? `
                <div style="padding:28px 16px;text-align:center;font-size:12px;color:var(--text-muted)">
                  ${isLeader ? '가입한 학생 계정이 아직 없습니다.' : '등록된 방장 계정이 없습니다.'}
                </div>
              ` : partners.map(p => {
                const tk = isLeader ? `${p.id}__${user.id}` : `${user.id}__${p.id}`;
                const last = state.store.whisperMessages.filter(m => m.threadKey === tk).slice(-1)[0];
                const unread = unreadFrom[p.id] || 0;
                return `
                  <button type="button" class="whisper-thread-item ${activePartner && activePartner.id === p.id ? 'active' : ''}" data-action="select-whisper" data-partner-id="${esc(p.id)}">
                    <div style="min-width:0">
                      <div style="font-size:13.5px;font-weight:600">${esc(p.name)} <span style="font-weight:400;color:var(--text-muted);font-size:12px">· ${esc(p.sub)}</span></div>
                      <div style="font-size:12px;color:var(--text-muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${last ? esc(last.text) : '대화 내용이 없습니다.'}</div>
                    </div>
                    ${unread > 0 ? `<span class="mono-num" style="padding:2px 7px;border-radius:999px;background:#dc2626;color:#fff;font-size:11px;font-weight:700">${unread}</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          </aside>

          <section class="whisper-pane">
            ${activePartner ? `
              <div style="padding:14px 20px;background:#fff;border-bottom:1px solid var(--border-hairline)">
                <div style="font-size:14px;font-weight:700">${esc(activePartner.name)} (${esc(activePartner.sub)})</div>
                <div style="font-size:12px;color:var(--text-muted)">비공개 1:1 귓속말 · 상대방이 열람하면 숫자 1이 사라지고 읽음이 표시됩니다</div>
              </div>
              <div class="whisper-messages" id="whisper-scroll">
                ${threadMsgs.length === 0 ? '<div style="margin:auto;font-size:12.5px;color:var(--text-muted)">첫 번째 귓속말을 보내보세요.</div>' : threadMsgs.map(m => {
                  const mine = m.senderUserId === user.id;
                  return `
                    <div class="msg-row ${mine ? 'mine' : 'theirs'}">
                      ${!mine ? `<div style="font-size:11px;color:var(--text-muted);margin-bottom:3px;padding:0 4px">${esc(m.senderName)}</div>` : ''}
                      <div class="msg-bubble-wrap">
                        <div class="msg-bubble">${esc(m.text)}</div>
                        <div class="msg-meta">
                          ${mine ? `<span class="${m.readByRecipient ? 'text-green' : 'text-amber'}" style="font-weight:700">${m.readByRecipient ? '읽음' : '1'}</span>` : ''}
                          <span style="color:#94a3b8">${esc(formatKstTime(m.createdAt))}</span>
                        </div>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
              <form id="whisper-form" style="padding:14px 16px;background:#fff;border-top:1px solid var(--border-hairline);display:flex;gap:10px">
                <input class="input" name="text" required placeholder="${esc(activePartner.name)}님에게 귓속말 입력..." />
                <button type="submit" class="btn btn-primary">${svgIcon('send', 14)}<span>전송</span></button>
              </form>
            ` : '<div style="margin:auto;font-size:13px;color:var(--text-muted);padding:32px">좌측 목록에서 대화 상대를 선택하세요.</div>'}
          </section>
        </div>
      `;
    }

    // ==================== TAB 6: CO2 RESEARCH LAB (RESTRICTED) ====================
    function renderResearchCharts(logs, customMetrics) {
      if (logs.length === 0) {
        return '<div style="height:240px;border:1px dashed var(--border-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-muted)">측정 데이터를 기록하면 그래프가 표시됩니다.</div>';
      }

      const xOpts = [{ key: 'co2Ppm', label: '이산화탄소 농도 (ppm)' }].concat(
        customMetrics.filter(m => m.type === 'number').map(m => ({ key: m.id, label: m.unit ? `${m.name} (${m.unit})` : m.name }))
      );
      const xLabel = (xOpts.find(o => o.key === state.xAxisKey) || xOpts[0]).label;
      const yLabel = state.yAxisKey === 'drowsyRate' ? '졸음 비율 (%)' : '졸음 인원 (명)';

      const getX = l => state.xAxisKey === 'co2Ppm' ? l.co2Ppm : (typeof l.customValues[state.xAxisKey] === 'number' ? l.customValues[state.xAxisKey] : null);
      const getY = l => state.yAxisKey === 'drowsyRate' ? l.drowsyRate : l.drowsyStudents;

      if (state.graphType === 'bar') {
        const ventGroups = [
          { key: 'open', label: '출입문 개방', color: '#16a34a' },
          { key: 'partial', label: '부분 개방', color: '#d97706' },
          { key: 'closed', label: '출입문 닫힘', color: '#dc2626' }
        ].map(g => {
          const items = logs.filter(l => l.doorVentilation === g.key);
          const avgRate = items.length ? (items.reduce((s, i) => s + i.drowsyRate, 0) / items.length).toFixed(1) : '0.0';
          const avgCo2 = items.length ? Math.round(items.reduce((s, i) => s + i.co2Ppm, 0) / items.length) : 0;
          return { ...g, count: items.length, avgRate: Number(avgRate), avgCo2 };
        });

        const bins = [
          { label: '1,000 ppm 미만 (양호)', items: logs.filter(l => l.co2Ppm < 1000), color: '#16a34a' },
          { label: '1,000~1,499 ppm (보통)', items: logs.filter(l => l.co2Ppm >= 1000 && l.co2Ppm < 1500), color: '#d97706' },
          { label: '1,500 ppm 이상 (환기 필요)', items: logs.filter(l => l.co2Ppm >= 1500), color: '#dc2626' }
        ].map(b => ({
          ...b,
          count: b.items.length,
          avgRate: b.items.length ? Number((b.items.reduce((s, i) => s + i.drowsyRate, 0) / b.items.length).toFixed(1)) : 0
        }));

        return `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
            <div style="border:1px solid var(--border-hairline);border-radius:8px;padding:18px">
              <h3 style="font-size:14px;font-weight:700;margin-bottom:14px">출입문 환기 상태별 평균 졸음 비율</h3>
              <div style="display:flex;flex-direction:column;gap:12px">
                ${ventGroups.map(g => `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                      <strong>${g.label} (${g.count}회 · 평균 ${g.avgCo2} ppm)</strong>
                      <strong class="mono-num">${g.avgRate}%</strong>
                    </div>
                    <div style="height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden">
                      <div style="height:100%;width:${Math.min(100, g.avgRate * 2)}%;background:${g.color}"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div style="border:1px solid var(--border-hairline);border-radius:8px;padding:18px">
              <h3 style="font-size:14px;font-weight:700;margin-bottom:14px">CO₂ 농도 구간별 평균 졸음 비율</h3>
              <div style="display:flex;flex-direction:column;gap:12px">
                ${bins.map(b => `
                  <div>
                    <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px">
                      <strong>${b.label} (${b.count}회)</strong>
                      <strong class="mono-num">${b.avgRate}%</strong>
                    </div>
                    <div style="height:10px;background:#f1f5f9;border-radius:999px;overflow:hidden">
                      <div style="height:100%;width:${Math.min(100, b.avgRate * 2)}%;background:${b.color}"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      const pairs = logs.map(l => ({ l, x: getX(l), y: getY(l) })).filter(p => p.x !== null);
      if (pairs.length === 0) {
        return '<div style="height:240px;border:1px dashed var(--border-strong);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-muted)">선택한 변수에 해당하는 수치 기록이 없습니다.</div>';
      }

      if (state.graphType === 'timeseries') {
        const w = 760, h = 290, pL = 52, pR = 52, pT = 22, pB = 40;
        const pW = w - pL - pR, pH = h - pT - pB;
        const xs = pairs.map(p => p.x), ys = pairs.map(p => p.y);
        const minX = Math.min(...xs) * 0.9, maxX = Math.max(...xs) * 1.1 || 10;
        const maxY = Math.max(10, Math.ceil(Math.max(...ys) * 1.15));
        const px = i => pairs.length === 1 ? pL + pW / 2 : pL + (i / (pairs.length - 1)) * pW;
        const pyL = v => pT + ((maxX - v) / Math.max(1, maxX - minX)) * pH;
        const pyR = v => pT + ((maxY - v) / Math.max(1, maxY)) * pH;
        const pathL = pairs.map((p, i) => `${i === 0 ? 'M' : 'L'} ${px(i).toFixed(1)} ${pyL(p.x).toFixed(1)}`).join(' ');
        const pathR = pairs.map((p, i) => `${i === 0 ? 'M' : 'L'} ${px(i).toFixed(1)} ${pyR(p.y).toFixed(1)}`).join(' ');
        const hov = pairs.find(p => p.l.id === state.hoveredResearchId);

        return `
          <div style="display:flex;gap:18px;font-size:12px;margin-bottom:10px">
            <span class="text-blue" style="font-weight:600">― 좌측 축: ${esc(xLabel)}</span>
            <span class="text-red" style="font-weight:600">― 우측 축: ${esc(yLabel)}</span>
          </div>
          <div style="border:1px solid var(--border-hairline);border-radius:8px;background:#f8fafc;padding:10px">
            <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:280px;overflow:visible">
              ${[0, 0.5, 1].map(r => {
                const y = pT + (1 - r) * pH;
                return `
                  <line x1="${pL}" y1="${y}" x2="${w - pR}" y2="${y}" stroke="#e2e8f0" stroke-width="1" />
                  <text x="${pL - 6}" y="${y + 4}" text-anchor="end" fill="#1d4ed8" font-size="10" font-family="monospace">${(minX + (maxX - minX) * r).toFixed(0)}</text>
                  <text x="${w - pR + 6}" y="${y + 4}" text-anchor="start" fill="#dc2626" font-size="10" font-family="monospace">${(maxY * r).toFixed(0)}</text>
                `;
              }).join('')}
              ${pairs.length > 1 ? `<path d="${pathL}" fill="none" stroke="#1d4ed8" stroke-width="2.2" /><path d="${pathR}" fill="none" stroke="#dc2626" stroke-width="2.2" />` : ''}
              ${pairs.map((p, i) => `
                <circle cx="${px(i)}" cy="${pyL(p.x)}" r="5" fill="#1d4ed8" stroke="#fff" stroke-width="1.5" style="cursor:pointer" data-hover-research="${esc(p.l.id)}" />
                <circle cx="${px(i)}" cy="${pyR(p.y)}" r="5" fill="#dc2626" stroke="#fff" stroke-width="1.5" style="cursor:pointer" data-hover-research="${esc(p.l.id)}" />
                <text x="${px(i)}" y="${h - 12}" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace">#${i + 1}</text>
              `).join('')}
            </svg>
          </div>
          ${hov ? `<div style="margin-top:8px;padding:8px 12px;background:#0f172a;color:#fff;border-radius:8px;font-size:12px;display:flex;justify-content:space-between"><strong>${esc(hov.l.sessionLabel)}</strong><span class="mono-num">${esc(xLabel)}: ${hov.x} · ${esc(yLabel)}: ${hov.y}</span></div>` : ''}
        `;
      }

      // Scatter + linear regression
      const n = pairs.length;
      const meanX = pairs.reduce((s, p) => s + p.x, 0) / n;
      const meanY = pairs.reduce((s, p) => s + p.y, 0) / n;
      let num = 0, dX = 0, dY = 0;
      pairs.forEach(p => { const dx = p.x - meanX, dy = p.y - meanY; num += dx * dy; dX += dx * dx; dY += dy * dy; });
      const den = Math.sqrt(dX * dY);
      const r = n >= 2 && den > 0 ? (num / den).toFixed(3) : null;
      const r2 = r !== null ? (Number(r) * Number(r)).toFixed(3) : null;
      const slope = dX > 0 ? num / dX : 0;
      const intercept = meanY - slope * meanX;

      const w = 760, h = 300, pL = 56, pR = 24, pT = 22, pB = 44;
      const pW = w - pL - pR, pH = h - pT - pB;
      const xs = pairs.map(p => p.x), ys = pairs.map(p => p.y);
      const rawMinX = Math.min(...xs), rawMaxX = Math.max(...xs);
      const marginX = Math.max(1, (rawMaxX - rawMinX) * 0.1);
      const minX = Math.max(0, rawMinX - marginX), maxX = rawMaxX + marginX;
      const minY = 0, maxY = Math.max(10, Math.ceil(Math.max(...ys) * 1.15));
      const mx = v => pL + ((v - minX) / Math.max(1, maxX - minX)) * pW;
      const my = v => pT + ((maxY - v) / Math.max(1, maxY - minY)) * pH;
      const regY1 = Math.max(minY, Math.min(maxY, slope * minX + intercept));
      const regY2 = Math.max(minY, Math.min(maxY, slope * maxX + intercept));
      const hov = pairs.find(p => p.l.id === state.hoveredResearchId);

      return `
        <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;font-size:12px;margin-bottom:10px">
          <div style="display:flex;gap:14px">
            <span>● <span class="text-green">출입문 개방</span></span>
            <span>● <span class="text-amber">부분 개방</span></span>
            <span>● <span class="text-red">출입문 닫힘</span></span>
          </div>
          ${r !== null ? `<div class="mono-num">선형 회귀 추세선 · r = <strong class="text-blue">${r}</strong> · R² = <strong>${r2}</strong></div>` : ''}
        </div>
        <div style="border:1px solid var(--border-hairline);border-radius:8px;background:#f8fafc;padding:10px">
          <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:285px;overflow:visible">
            ${[0, 0.25, 0.5, 0.75, 1].map(ratio => {
              const val = minY + (maxY - minY) * ratio;
              const y = my(val);
              return `<line x1="${pL}" y1="${y}" x2="${w - pR}" y2="${y}" stroke="#e2e8f0" /><text x="${pL - 8}" y="${y + 4}" text-anchor="end" fill="#64748b" font-size="10" font-family="monospace">${val.toFixed(0)}</text>`;
            }).join('')}
            ${[0, 0.25, 0.5, 0.75, 1].map(ratio => {
              const val = minX + (maxX - minX) * ratio;
              return `<text x="${mx(val)}" y="${h - 18}" text-anchor="middle" fill="#64748b" font-size="10" font-family="monospace">${val.toFixed(0)}</text>`;
            }).join('')}
            <text x="${pL + pW / 2}" y="${h - 2}" text-anchor="middle" fill="#334155" font-size="11" font-weight="600">${esc(xLabel)}</text>
            <text x="14" y="${pT + pH / 2}" text-anchor="middle" transform="rotate(-90 14 ${pT + pH / 2})" fill="#334155" font-size="11" font-weight="600">${esc(yLabel)}</text>
            ${pairs.length >= 2 ? `<line x1="${mx(minX)}" y1="${my(regY1)}" x2="${mx(maxX)}" y2="${my(regY2)}" stroke="#1d4ed8" stroke-width="2" stroke-dasharray="6 4" />` : ''}
            ${pairs.map(p => {
              const c = p.l.doorVentilation === 'open' ? '#16a34a' : p.l.doorVentilation === 'partial' ? '#d97706' : '#dc2626';
              const active = state.hoveredResearchId === p.l.id;
              return `<circle cx="${mx(p.x)}" cy="${my(p.y)}" r="${active ? 8 : 6}" fill="${c}" stroke="#fff" stroke-width="2" style="cursor:pointer" data-hover-research="${esc(p.l.id)}" />`;
            }).join('')}
          </svg>
        </div>
        ${hov ? `<div style="margin-top:8px;padding:8px 12px;background:#0f172a;color:#fff;border-radius:8px;font-size:12px;display:flex;justify-content:space-between"><span><strong>${esc(hov.l.sessionLabel)}</strong> · ${esc(formatKstDateTime(hov.l.recordedAt))}</span><span class="mono-num">${esc(xLabel)}: ${hov.x} · ${esc(yLabel)}: ${hov.y} (${hov.l.drowsyStudents}/${hov.l.totalStudents}명)</span></div>` : ''}
      `;
    }

    function renderResearchTab(user) {
      if (!user.isResearcher) {
        return `

            <h2 style="font-size:18px;font-weight:700">지정된 연구 담당자 전용 구역</h2>
            <p style="font-size:13.5px;color:var(--text-secondary);margin-top:8px;line-height:1.6">
              이산화탄소 농도와 졸음 상관관계 프로젝트 데이터는 지정된 연구 권한이 부여된 사용자만 열람·조작할 수 있습니다.
            </p>

      }

      const logs = state.store.researchLogs;
      const metrics = state.store.customMetrics;
      const avgCo2 = logs.length ? Math.round(logs.reduce((s, l) => s + l.co2Ppm, 0) / logs.length) : 0;

      // Pearson r for CO2 vs drowsyRate
      let pearsonText = '-';
      let r2Text = '2건 이상 측정 시 계산';
      if (logs.length >= 2) {
        const mx = logs.reduce((s, l) => s + l.co2Ppm, 0) / logs.length;
        const my = logs.reduce((s, l) => s + l.drowsyRate, 0) / logs.length;
        let num = 0, dx = 0, dy = 0;
        logs.forEach(l => { num += (l.co2Ppm - mx) * (l.drowsyRate - my); dx += (l.co2Ppm - mx) ** 2; dy += (l.drowsyRate - my) ** 2; });
        const den = Math.sqrt(dx * dy);
        if (den > 0) {
          const r = num / den;
          pearsonText = r.toFixed(3);
          r2Text = `결정계수 R² = ${(r * r).toFixed(3)}`;

              <p style="font-size:12px;color:var(--text-muted);margin-top:2px">이산화탄소 농도, 총 인원 중 졸고 있는 인원, 출입문 환기 상태 및 추가 항목을 기록합니다.</p>

            <form id="research-log-form" style="margin-top:14px;display:flex;flex-direction:column;gap:14px">

                </div>
                <div>
                  <label class="label">출입문 환기 상태</label>
                  <select class="select" name="doorVentilation">
                    <option value="open">개방 (환기 중)</option>

              </div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
                <div>
                  <label class="label">단위</label>
                  <input class="input" name="unit" placeholder="예: dB, lux" />

      `;

                        ${u.isResearcher ? '<span class="text-green">CO₂ 연구 지정됨</span>' : '연구 권한 없음'}
                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    // ==================== MAIN RENDER ====================
    function render() {

      else if (state.activeTab === 'attendance') bodyHtml = renderAttendanceTab(user);
      else if (state.activeTab === 'whispers') bodyHtml = renderWhisperTab(user);
      else bodyHtml = renderResearchTab(user);

      root.innerHTML = `
        <div class="app-shell">
          <header class="topbar">
            <button type="button" class="brand-mark" data-action="switch-tab" data-tab="overview">면학마루</button>
            <nav class="nav-links">
              ${navItems.filter(n => n.visible).map(n => `
                <button type="button" class="nav-link ${state.activeTab === n.id ? 'active' : ''}" data-action="switch-tab" data-tab="${n.id}">
                  ${n.label}${n.id === 'extrastudy' && pendingCount > 0 ? ` <span class="mono-num text-amber">(${pendingCount})</span>` : ''}
                </button>
